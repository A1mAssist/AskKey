name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Check release binary for E2E symbols
        run: bash scripts/check_release_symbols.sh

      - name: Check optimized cancellation runtime
        run: bash scripts/test-cancellation-runtime.sh

      - name: Verify UI delivery gate rejects incomplete runs
        run: python3 -m unittest discover -s Tests/Automation -v

      - name: Check isolated development launcher
        run: bash scripts/test-dev-launch.sh

      - name: Check repository hygiene
        run: python3 scripts/check_hygiene.py

      - name: Check module dependencies
        run: python3 scripts/check_module_deps.py

  basic-ui-flows:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install XcodeGen
        run: brew list xcodegen || brew install xcodegen
      - name: Run required desktop flows
        run: bash scripts/run-e2e.sh
      - name: Capture optional key screen screenshots
        continue-on-error: true
        run: bash scripts/run-e2e.sh screenshots
      - name: Preserve UI evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: askkey-basic-ui-evidence
          path: Tests/UI/output/
          if-no-files-found: error
          retention-days: 7
